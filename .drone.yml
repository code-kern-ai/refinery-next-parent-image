kind: pipeline
type: docker
name: amd64

platform:
  arch: amd64

steps:
  - name: login dhi.io
    image: docker:cli
    environment:
      DOCKER_USERNAME:
        from_secret: dockerhub_username
      DOCKER_PASSWORD:
        from_secret: dockerhub_password
    commands:
      - echo "$DOCKER_PASSWORD" | docker login dhi.io -u "$DOCKER_USERNAME" --password-stdin
  - name: build and publish
    image: plugins/docker
    depends_on:
      - login dhi.io
    settings:
      registry: registry.dev.kern.ai
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      repo: "registry.dev.kern.ai/code-kern-ai/refinery-parent-images"
      tags: ["${DRONE_COMMIT_SHA}-next", "${DRONE_COMMIT_BRANCH}-next"]
      cache_from:
        - "registry.dev.kern.ai/code-kern-ai/refinery-parent-images:dev-next"
        - "registry.dev.kern.ai/code-kern-ai/refinery-parent-images:${DRONE_COMMIT_BRANCH}-next"
      config:
        from_secret: docker_config_json 

trigger:
  event:
    - push

