kind: pipeline
type: docker
name: amd64

platform:
  arch: amd64

steps:
  - name: diagnose cache
    image: docker:cli
    environment:
      REGISTRY_USER:
        from_secret: docker_username
      REGISTRY_PASS:
        from_secret: docker_password
      DHI_USER:
        from_secret: dockerhub_username
      DHI_PASS:
        from_secret: dockerhub_password
    commands:
      - apk add --no-cache jq >/dev/null
      - echo "$REGISTRY_PASS" | docker login registry.dev.kern.ai -u "$REGISTRY_USER" --password-stdin
      - echo "$DHI_PASS" | docker login dhi.io -u "$DHI_USER" --password-stdin
      - |
        REPO="registry.dev.kern.ai/code-kern-ai/refinery-parent-images"
        for TAG in "dev-next" "${DRONE_COMMIT_BRANCH}-next"; do
          echo "=== DEBUG hyp=H1/H2 tag=${TAG} ==="
          docker pull "${REPO}:${TAG}" 2>&1 || echo "PULL_FAILED tag=${TAG}"
          docker image inspect "${REPO}:${TAG}" --format 'arch={{.Architecture}} os={{.Os}} id={{.Id}}' 2>&1 || true
          docker manifest inspect "${REPO}:${TAG}" 2>&1 | head -20 || echo "MANIFEST_FAILED tag=${TAG}"
        done
      - |
        echo "=== DEBUG hyp=H3 dhi base images ==="
        for IMG in dhi.io/node:20-debian12-dev dhi.io/node:20-debian12; do
          docker pull "$IMG" 2>&1 || echo "DHI_PULL_FAILED img=$IMG"
          docker image inspect "$IMG" --format 'arch={{.Architecture}} os={{.Os}}' 2>&1 || true
        done
  - name: build and publish
    image: plugins/docker
    depends_on:
      - diagnose cache
    settings:
      registry: registry.dev.kern.ai
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      base_image_registry: dhi.io
      base_image_username:
        from_secret: dockerhub_username
      base_image_password:
        from_secret: dockerhub_password
      repo: "registry.dev.kern.ai/code-kern-ai/refinery-parent-images"
      tags: ["${DRONE_COMMIT_SHA}-next", "${DRONE_COMMIT_BRANCH}-next"]
      cache_from:
        - "registry.dev.kern.ai/code-kern-ai/refinery-parent-images:dev-next"
        - "registry.dev.kern.ai/code-kern-ai/refinery-parent-images:${DRONE_COMMIT_BRANCH}-next"


trigger:
  event:
    - push

---
kind: pipeline
type: docker
name: arm64

platform:
  arch: arm64

steps:
  - name: build and publish
    image: plugins/docker
    settings:
      registry: registry.dev.kern.ai
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      base_image_registry: dhi.io
      base_image_username:
        from_secret: dockerhub_username
      base_image_password:
        from_secret: dockerhub_password
      repo: "registry.dev.kern.ai/code-kern-ai/refinery-parent-images"
      tags:
        ["${DRONE_COMMIT_SHA}-next-arm64", "${DRONE_COMMIT_BRANCH}-next-arm64"]
      cache_from:
        - "registry.dev.kern.ai/code-kern-ai/refinery-parent-images:dev-next-arm64"
        - "registry.dev.kern.ai/code-kern-ai/refinery-parent-images:${DRONE_COMMIT_BRANCH}-next-arm64"

trigger:
  branch:
    - dev
  event:
    - push

---
kind: pipeline
type: docker
name: amd64-dockerhub

platform:
  arch: amd64

steps:
  - name: build and publish
    image: plugins/docker
    settings:
      username:
        from_secret: dockerhub_username
      password:
        from_secret: dockerhub_password
      base_image_registry: dhi.io
      base_image_username:
        from_secret: dockerhub_username
      base_image_password:
        from_secret: dockerhub_password
      repo: "kernai/refinery-parent-images"
      tag: "${DRONE_TAG}-next-drone-amd64"

trigger:
  event:
    - tag

---
kind: pipeline
type: docker
name: arm64-dockerhub

platform:
  arch: arm64

steps:
  - name: build and publish
    image: plugins/docker
    settings:
      username:
        from_secret: dockerhub_username
      password:
        from_secret: dockerhub_password
      base_image_registry: dhi.io
      base_image_username:
        from_secret: dockerhub_username
      base_image_password:
        from_secret: dockerhub_password
      repo: "kernai/refinery-parent-images"
      tag: "${DRONE_TAG}-next-drone-arm64"
trigger:
  event:
    - tag

---
kind: pipeline
name: manifest
steps:
  - name: manifest
    image: plugins/manifest
    settings:
      spec: manifest.tmpl
      username:
        from_secret: dockerhub_username
      password:
        from_secret: dockerhub_password

depends_on:
  - amd64-dockerhub
  - arm64-dockerhub

trigger:
  event:
    - tag
